# Shift-left: ловимо секрет ще до коміту, на ноутбуці розробника
# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-ll"]
        files: ^examples/hms-legacy/PROJECT/
